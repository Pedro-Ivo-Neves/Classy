version: 0.2.1
repository: https://github.com/Pedro-Ivo-Neves/Classy

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  macros: ^0.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0

topics:
