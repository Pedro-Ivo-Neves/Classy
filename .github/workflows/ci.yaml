name: Dart Package CI 🧪

on:
    pull_request: 
    push:
        branches: [main]
    workflow_dispatch: 

jobs:
    Test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            sdk: [stable, dev]
        steps:
            - name: 📁 Checkout code
              uses: actions/checkout@v2

            - name: 🎯 Set up Dart
              uses: dart-lang/setup-dart@v1
              with:
                sdk: ${{matrix.sdk}}

            - name: ⬇️ Install dependencies
              run: dart pub get

            - name: 🔍 Analyze
              run: dart --enable-experiment=macros analyze --fatal-warnings lib

            - name: 🧪 Run tests
              run: dart --enable-experiment=macros run ./test/classy_test.dart